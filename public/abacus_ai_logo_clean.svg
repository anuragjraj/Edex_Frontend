<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-labelledby="title desc">
  <title id="title">Abacus AI logo</title>
  <desc id="desc">A clean vector symbol combining an abacus and an AI circuit brain.</desc>
  <defs>
    <linearGradient id="brain" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1587ff"/>
      <stop offset="1" stop-color="#0b47b5"/>
